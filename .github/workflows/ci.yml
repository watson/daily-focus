name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack the npm package
        run: npm pack --dry-run

      - name: Initialize an isolated sample store
        run: npm run init
        env:
          DAILY_FOCUS_DATA: ${{ runner.temp }}/daily-focus

      - name: Seed an isolated sample store
        run: npm run seed
        env:
          DAILY_FOCUS_DATA: ${{ runner.temp }}/daily-focus

      - name: Audit the sample brief
        run: npm run audit
        env:
          DAILY_FOCUS_DATA: ${{ runner.temp }}/daily-focus

  app:
    # The menu bar app is Swift and macOS-only. Signed ad hoc here, since a runner
    # has no certificate, which is enough for the build and the self-test.
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dmgbuild, which lays out the disk image, needs Python 3.10 or newer.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The app carries Node.js, downloaded from nodejs.org at the pinned version.
      - name: Cache the Node.js the app carries
        uses: actions/cache@v6
        with:
          path: macos/build/node-v*
          key: app-node-${{ hashFiles('node-version') }}

      - name: Build the menu bar app and its disk image, and run its self-test
        run: npm run app -- --test

  binaries:
    # The Linux and Windows executables are the official Node.js with the package
    # injected, which asks nothing of the platform each is for, so one Linux runner
    # builds all of them. It runs the one for itself; the Windows one is run below.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the Node.js the executables carry
        uses: actions/cache@v6
        with:
          path: binaries/build/node-v*
          key: binaries-node-${{ hashFiles('node-version') }}

      - name: Build the executables and run the Linux one
        run: npm run binaries -- --test

      - name: Hand the Windows executable to its check
        uses: actions/upload-artifact@v7
        with:
          name: daily-focus-win-x64
          path: binaries/build/daily-focus-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  binaries-windows:
    needs: binaries
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # For the check alone, which runs the executable and needs no package installed.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch the Windows executable
        uses: actions/download-artifact@v8
        with:
          name: daily-focus-win-x64
          path: binaries/build

      - name: Run it
        run: |
          New-Item -ItemType Directory -Path binaries/build/check | Out-Null
          tar -xf binaries/build/daily-focus-win-x64.zip -C binaries/build/check
          node binaries/build.ts --check binaries/build/check/daily-focus.exe
