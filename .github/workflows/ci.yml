name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Initialize an isolated sample store
        run: npm run init
        env:
          DAILY_FOCUS_DATA: ${{ runner.temp }}/daily-focus

      - name: Seed an isolated sample store
        run: npm run seed
        env:
          DAILY_FOCUS_DATA: ${{ runner.temp }}/daily-focus

      - name: Audit the sample brief
        run: npm run audit
        env:
          DAILY_FOCUS_DATA: ${{ runner.temp }}/daily-focus
