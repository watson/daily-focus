name: Release

# Every push to main is a development build: a GitHub prerelease holding the
# disk image, the dashboard on its own and the release notes, and the same
# version on npm under the `dev` tag. A stable release is cut from main by hand, with Run workflow, and goes to
# npm's `latest`. Only a stable release's disk image is notarised: that is a wait
# on Apple's queue, anything from seconds to most of an hour, and a development
# build is signed but ready in minutes. Versions and notes come from the Conventional
# Commits since the last release: see scripts/release.ts.
#
# Two jobs, so that what can publish never runs a dependency. `build` installs
# packages, tests, packs and signs, and can't publish. `publish` can, through
# npm's trusted publishing, which lets this workflow publish without 2FA, and it
# runs nothing but npm and gh on what `build` handed it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.0.0. Leave empty to work it out from the commits.
        required: false
        default: ''

permissions:
  contents: read

# One release at a time, none cut short. A push that lands while one runs waits,
# and a newer push replaces it in the queue: its build carries the same commits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    # Mostly Apple's notary service, for a stable release: macos/build.sh allows
    # its one submission an hour, then fails with its id rather than be cut off.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          # Every commit and tag: the version counts the commits since the last release.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(node scripts/release.ts version --dev)
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          else
            version=$(node scripts/release.ts version --set "$REQUESTED")
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Into the package, and from there into the app, which takes its version
      # from the package it carries. Never committed: main only moves by pull request.
      # With it, the last commit to change the app itself: an app that finds a
      # newer release with another one offers its disk image, while a release that
      # changed only the dashboard updates without one.
      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pkg set "daily-focus.appSource=$(git log -1 --format=%H -- macos tools/dfcal ':(exclude)macos/dmg-settings.py')"

      # The tarball npm gets, and the app is built around, unpacked as npm would,
      # the way `npm run app` does it. The last step to run npm packages, so none
      # of them runs once the signing certificate is in reach.
      - name: Pack the package and write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/server"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release/daily-focus-$VERSION.tgz" -C "$RUNNER_TEMP/server"
          node scripts/release.ts notes "$VERSION" > "$RUNNER_TEMP/release/notes.md"

      # dmgbuild, which lays out the disk image, needs Python 3.10 or newer.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache the Node.js the app carries
        uses: actions/cache@v6
        with:
          path: macos/build/node-v*
          key: app-node-${{ hashFiles('macos/node-version') }}

      # A keychain of the run's own, first in the search list and the default, so
      # that macos/build.sh finds the certificate and the notary profile without
      # being told where. The notary profile only for a stable release, since
      # build.sh notarises when it is named. CONTRIBUTING.md says how to make the
      # secrets.
      - name: Put the signing certificate, and for a stable release the notary key, in a keychain
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          required="DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD"
          [ "$CHANNEL" = dev ] || required="$required NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID"
          missing=""
          for name in $required; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are missing:$missing. CONTRIBUTING.md says how to make them."
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"
          if [ "$CHANNEL" = dev ]; then
            echo "a development build: signed, not notarised"
            exit 0
          fi
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials daily-focus-release --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          rm "$RUNNER_TEMP/notary.p8"
          echo "DAILY_FOCUS_NOTARY_PROFILE=daily-focus-release" >> "$GITHUB_ENV"

      # And the dashboard as a signed bundle of its own, which apps download to
      # update it. It isn't notarised: macOS never runs it, the app's Node does.
      - name: Build and sign the menu bar app and its disk image, notarised for a stable release
        run: |
          sh macos/build.sh --server "$RUNNER_TEMP/server/package" --test
          cp macos/build/Daily-Focus.dmg macos/build/Daily-Focus-Dashboard.zip "$RUNNER_TEMP/release/"

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2> /dev/null || true

      - name: Hand the release to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm's trusted publishing

    # No checkout and no install: npm, gh and the files the build made.
    steps:
      # A development build that main moved past while it was building is left
      # unpublished: the newer push's run publishes its own. GitHub would also
      # refuse this job's token the build's tag whenever a later push changed a
      # workflow, since it may not create a ref whose workflows differ from main's.
      - name: Check this is still main's newest commit
        id: current
        if: needs.build.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to ${head:0:7}, whose own run publishes it, so this build isn't published"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the release
        if: steps.current.outputs.superseded != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # First, so that a tag GitHub refuses leaves nothing on npm without its
      # notes. A rerun finds the release made and only refreshes it.
      - name: Make the GitHub release
        if: steps.current.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          tag="v$VERSION"
          assets="release/Daily-Focus.dmg release/Daily-Focus-Dashboard.zip"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file release/notes.md
            gh release upload "$tag" $assets --clobber
          elif [ "$CHANNEL" = dev ]; then
            gh release create "$tag" $assets --target "$GITHUB_SHA" --title "$tag" --notes-file release/notes.md --prerelease
          else
            gh release create "$tag" $assets --target "$GITHUB_SHA" --title "$tag" --notes-file release/notes.md --latest
          fi

      # Trusted publishing needs npm 11.5.1 or newer, which the newest Node 24
      # carries; a runner's cached Node 24 might be older.
      - name: Set up Node.js
        if: steps.current.outputs.superseded != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      # A tarball is published as it is, with no scripts run. The leading ./ is
      # what makes it a file: npm reads "release/x.tgz" as a GitHub repository,
      # owner "release". A rerun finds this version already published.
      - name: Publish to npm
        if: steps.current.outputs.superseded != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          if [ "$(npm view "daily-focus@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "daily-focus@$VERSION is already on npm"
          else
            npm publish "./release/daily-focus-$VERSION.tgz" --tag "$CHANNEL" --ignore-scripts
          fi
