<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Focus</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- Served by the server: a briefcase for work, a house for personal. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /*
       * Applied before first paint so a dark-mode user never sees a white flash,
       * and so the toggle's three icons have a state to key off in that paint too.
       * It has to live here rather than in the bundle: the bundle is fetched after
       * this document is already on screen.
       *
       * Only the two explicit modes are ever stored. Anything else — nothing yet,
       * a value from an older build, a hand-edited one — stamps `system`, which
       * pins no scheme and leaves the OS in charge. `client/theme.ts` writes the
       * same attribute and reads the same key from then on.
       */
      const stored = localStorage.getItem('daily-focus:theme');
      document.documentElement.dataset.theme =
        stored === 'light' || stored === 'dark' ? stored : 'system';
    </script>
  </head>
  <body>
    <!--
      The page is built by app.js, bundled from client/. Nothing is written here
      that the client would only have to describe again: one source for the
      markup, and one place a change to it is made.
    -->
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
